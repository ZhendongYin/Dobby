# Reverse proxy for Phoenix (LiveView WebSocket + long poll).
# Upstream hostname must match the `web` service name in docker-compose.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream phoenix {
    server web:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;
    # LiveView longpoll URLs carry large query strings (_track_static[], vsn, etc.).
    # Defaults are small; underruns can yield odd proxy errors on some installs.
    client_header_buffer_size 32k;
    large_client_header_buffers 8 64k;

    location / {
        proxy_pass http://phoenix;
        proxy_http_version 1.1;

        # Preserve Host:port as sent by the client (needed for non-default HTTP ports)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # LiveView long poll can hold connections open for a long time
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
    }
}
